{% extends "base.html" %}
{% block content %}
<style>
    .label-title { font-weight: 700; color: #4f5d73; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; display: block; }
    .custom-input { border: 1px solid #b1b7c1 !important; border-radius: 4px !important; padding: 8px 12px; }
</style>

<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white p-2">
                    <h6 class="mb-0">
                        <i class="cil-list me-2"></i>
                        {% if form.instance.pk %}
                            Edit SubTask: <span class="fw-normal">{{ form.instance.title }}</span>
                        {% else %}
                            Add SubTask for: <span class="fw-normal">{{ task.title }}</span>
                        {% endif %}
                    </h6>
                </div>
                <div class="card-body p-4">
                    <form method="post" autocomplete="off">
                        {% csrf_token %}
                        
                        <input type="hidden" name="parent_task" value="{% if form.instance.pk %}{{ form.instance.parent_task.id }}{% else %}{{ task.id }}{% endif %}">

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="label-title">SubTask Title</label>
                                <input type="text" name="title" class="form-control custom-input" 
                                       value="{{ form.title.value|default:'' }}" placeholder="Enter subtask name..." required>
                            </div>

                            <div class="col-md-12">
                                <label class="label-title">Status</label>
                                <select name="status" class="form-select custom-input">
                                    <option value="Pending" {% if form.status.value == "Pending" %}selected{% endif %}>Pending</option>
                                    <option value="In Progress" {% if form.status.value == "In Progress" %}selected{% endif %}>In Progress</option>
                                    <option value="Completed" {% if form.status.value == "Completed" %}selected{% endif %}>Completed</option>
                                </select>
                            </div>
                        </div>

                        <div class="border-top mt-4 pt-3 d-flex justify-content-end gap-2">
                            <button type="button" onclick="history.back()" class="btn btn-sm btn-light border px-4">
                                Cancel
                            </button>
                            
                            <button type="submit" class="btn btn-sm {% if 'note' in request.path %}btn-dark{% else %}btn-info text-white{% endif %} px-5 fw-bold">
                                {% if form.instance.pk %} Update {% else %} Save {% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">{% if form.instance.pk %}Edit Category{% else %}Add Category{% endif %}</h4>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Save</button>
  <a href="{% url 'category-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

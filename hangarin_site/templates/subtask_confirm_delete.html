{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="cil-warning text-danger" style="font-size: 4rem;"></i>
                </div>
                <h3 class="fw-bold mb-3">Delete Subtask?</h3>
                <p class="text-muted mb-4">
                    Are you sure you want to delete subtask <span class="fw-bold text-dark">"{{ object.title }}"</span>? 
                    This action cannot be undone.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg text-white fw-bold">Yes, Delete Permanently</button>
                        <a href="{% url 'subtask-list' %}" class="btn btn-light btn-lg border">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

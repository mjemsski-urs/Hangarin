{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Tasks</h4>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Title</th>
      <th>Status</th>
      <th>Deadline</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for task in tasks %}
      <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.status }}</td>
        <td>{{ task.deadline }}</td>
        <td>
          <a href="{% url 'task-detail' task.pk %}" class="btn btn-sm btn-info">View</a>
          <a href="{% url 'task-edit' task.pk %}" class="btn btn-sm btn-warning">Edit</a>
          <a href="{% url 'task-delete' task.pk %}" class="btn btn-sm btn-danger">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="4">No tasks yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
<a href="{% url 'task-add' %}" class="btn btn-primary">Add Task</a>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white p-3">
                    <h5 class="mb-0"><i class="cil-list me-2"></i>SubTask Detail</h5>
                </div>
                <div class="card-body p-4">
                    <div class="mb-4">
                        <label class="text-muted small fw-bold text-uppercase">SubTask Title</label>
                        <h4 class="fw-bold text-dark">{{ subtask.title }}</h4>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="p-3 border rounded bg-light">
                                <label class="text-muted small fw-bold d-block">Status</label>
                                <span class="badge {% if subtask.status == 'Completed' %}bg-success{% else %}bg-primary{% endif %}">
                                    {{ subtask.status }}
                                </span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 border rounded bg-light">
                                <label class="text-muted small fw-bold d-block">Parent Task</label>
                                <a href="{% url 'task-detail' subtask.parent_task.id %}" class="text-decoration-none fw-semibold">
                                    <i class="cil-task me-1"></i> {{ subtask.parent_task.title }}
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="border-top pt-3 d-flex gap-2">
                        {% if user.is_authenticated %}
                        <a href="{% url 'subtask-edit' subtask.id %}" class="btn btn-warning px-4">
                            <i class="cil-pencil me-1"></i> Edit
                        </a>
                        <a href="{% url 'subtask-delete' subtask.id %}" class="btn btn-danger px-4">
                            <i class="cil-trash me-1"></i> Delete
                        </a>
                        {% endif %}
                        <a href="#" onclick="history.back(); return false;" class="btn btn-secondary">
                            <i class="cil-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

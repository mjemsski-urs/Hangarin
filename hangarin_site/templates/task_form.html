{% extends "base.html" %}
{% block content %}
<style>
    /* Kulay para sa Buttons */
    .btn-check:checked + .btn-outline-info { background-color: #39f !important; color: white !important; }
    .btn-check:checked + .btn-outline-warning { background-color: #f9b115 !important; color: white !important; }
    .btn-check:checked + .btn-outline-danger { background-color: #e55353 !important; color: white !important; }
    .btn-check:checked + .btn-outline-primary { background-color: #321fdb !important; color: white !important; }
    
    .label-title { font-weight: 700; color: #4f5d73; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; display: block; }
    .custom-input { border: 1px solid #b1b7c1 !important; border-radius: 4px !important; padding: 8px 12px; }
</style>

<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white p-2">
                    <h6 class="mb-0">
                      <i class="cil-pencil me-2"></i>
                      {% if form.instance.pk %}
                          Edit Task Details
                      {% else %}
                          Add New Task
                      {% endif %}
                  </h6>
                </div>
                <div class="card-body p-4">
                    <form method="post" autocomplete="off">
                        {% csrf_token %}
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="label-title">Task Title</label>
                                    <input type="text" name="title" class="form-control custom-input" value="{{ form.title.value|default:'' }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="label-title">Description (Optional)</label>
                                    <textarea name="description" class="form-control custom-input" rows="5">{{ form.description.value|default:'' }}</textarea>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="label-title">Deadline & Time</label>
                                    <div class="input-group" id="deadlinePicker" data-td-target-input="nearest" data-td-target-toggle="nearest">
                                        <input type="text" name="deadline" id="deadline" class="form-control custom-input" 
                                               value="{{ form.deadline.value|date:'m/d/Y h:i A'|default:'' }}" 
                                               data-td-target="#deadlinePicker">
                                        <span class="input-group-text" data-td-target="#deadlinePicker" data-td-toggle="datetimepicker">
                                            <i class="cil-calendar"></i>
                                        </span>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="label-title">Category</label>
                                    <div class="d-flex flex-wrap gap-2">
                                        {% for choice in form.category.field.queryset %}
                                        <input type="radio" class="btn-check" name="category" id="cat_{{ choice.id }}" value="{{ choice.id }}" {% if form.category.value|slugify == choice.id|slugify %}checked{% endif %}>
                                        <label class="btn btn-sm btn-outline-info" for="cat_{{ choice.id }}">{{ choice.name }}</label>
                                        {% endfor %}
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="label-title">Priority Level</label>
                                    <div class="d-flex flex-wrap gap-2">
                                        {% for choice in form.priority.field.queryset %}
                                        <input type="radio" class="btn-check" name="priority" id="prio_{{ choice.id }}" value="{{ choice.id }}" {% if form.priority.value|slugify == choice.id|slugify %}checked{% endif %}>
                                        <label class="btn btn-sm {% if choice.name == 'High' or choice.name == 'Critical' %}btn-outline-danger{% elif choice.name == 'Medium' %}btn-outline-warning{% else %}btn-outline-primary{% endif %}" for="prio_{{ choice.id }}">
                                            {{ choice.name }}
                                        </label>
                                        {% endfor %}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="border-top mt-4 pt-3 d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <span class="label-title mb-0">Status:</span>
                                <div class="btn-group btn-group-sm">
                                    <input type="radio" class="btn-check" name="status" id="stat1" value="Pending" {% if form.status.value == "Pending" %}checked{% endif %}>
                                    <label class="btn btn-outline-primary" for="stat1">Pending</label>

                                    <input type="radio" class="btn-check" name="status" id="stat2" value="In Progress" {% if form.status.value == "In Progress" %}checked{% endif %}>
                                    <label class="btn btn-outline-primary" for="stat2">In Progress</label>

                                    <input type="radio" class="btn-check" name="status" id="stat3" value="Completed" {% if form.status.value == "Completed" %}checked{% endif %}>
                                    <label class="btn btn-outline-primary" for="stat3">Completed</label>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <a href="{% url 'task-list' %}" class="btn btn-sm btn-light border px-4">Cancel</a>
                                <button type="submit" class="btn btn-sm btn-success px-5 text-white fw-bold">
                                    {% if form.instance.pk %}
                                        Update Task
                                    {% else %}
                                        Save Task
                                    {% endif %}
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@eonasdan/tempus-dominus/dist/css/tempus-dominus.min.css">
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@eonasdan/tempus-dominus/dist/js/tempus-dominus.min.js"></script>

<script>
    const picker = new tempusDominus.TempusDominus(document.getElementById('deadlinePicker'), {
        display: {
            components: { clock: true },
            theme: 'light',
            icons: { type: 'icons', time: 'cil-clock', date: 'cil-calendar', up: 'cil-arrow-top', down: 'cil-arrow-bottom' }
        }
    });
</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white p-3">
                    <h5 class="mb-0"><i class="cil-notes me-2"></i>Note Detail</h5>
                </div>
                <div class="card-body p-4">
                    
                   <div class="mb-4">
                <label class="text-muted small fw-bold text-uppercase">Note Content</label>
                <div class="p-3 border rounded bg-white shadow-sm" style="white-space: pre-wrap; border-left: 1px solid #dee2e6 !important;">
                    {{ note.content }}
                </div>
            </div>

                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="p-3 border rounded bg-light">
                                <label class="text-muted small fw-bold d-block">Associated Task</label>
                                <a href="{% url 'task-detail' note.task.id %}" class="text-decoration-none fw-semibold">
                                    <i class="cil-link me-1"></i> {{ note.task.title }}
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="border-top pt-3 d-flex gap-2">
                        <a href="{% url 'note-edit' note.id %}" class="btn btn-warning px-4">
                            <i class="cil-pencil me-1"></i> Edit
                        </a>
                        <a href="{% url 'note-delete' note.id %}" class="btn btn-danger px-4">
                            <i class="cil-trash me-1"></i> Delete
                        </a>
                        <a href="#" onclick="history.back(); return false;" class="btn btn-secondary">
                            <i class="cil-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 border-top border-danger border-4">
            <div class="card-body p-5 text-center">
                <div class="mb-4 text-danger"><i class="cil-trash" style="font-size: 4rem;"></i></div>
                <h3 class="fw-bold mb-3">Remove Category?</h3>
                <p class="text-muted mb-4">
                    Removing <span class="fw-bold text-dark">"{{ object.name }}"</span> might affect tasks assigned to this category.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg text-white fw-bold">Confirm Delete</button>
                        <a href="{% url 'category-list' %}" class="btn btn-light btn-lg border">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

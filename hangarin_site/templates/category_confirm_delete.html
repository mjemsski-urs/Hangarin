{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Delete Category</h4>
<p>Are you sure you want to delete "{{ object.name }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, delete</button>
  <a href="{% url 'category-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5 text-center">
                <div class="mb-4 text-danger"><i class="cil-shield-alt" style="font-size: 4rem;"></i></div>
                <h3 class="fw-bold mb-3">Delete Priority Level?</h3>
                <p class="text-muted mb-4">
                    Are you sure you want to delete the <span class="fw-bold text-dark">"{{ object.name }}"</span> priority?
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg text-white fw-bold">Yes, Remove Priority</button>
                        <a href="{% url 'priority-list' %}" class="btn btn-light btn-lg border">Go Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
